# arguments for dataset
dataset: cityscapes
data_root: Your/Cityscapes/Path
nclass: 19
crop_size: 798
use_augmix: False # 控制是否进行augmix
use_cutmix: True # 控制是否进行CutMix

# arguments for training
epochs: 180
batch_size: 2 # per GPU x 4 GPUs
lr: 0.000005
lr_multi: 40.0
criterion:
  name: OHEM
  kwargs:
    ignore_index: 255
    thresh: 0.7
    min_kept: 200000
conf_thresh: 0.95
jsd_weight: 0 # 建议从 0.1 开始尝试，如 0.05, 0.1, 0.2

# arguments for model
model: dpt
backbone: dinov2_small
lock_backbone: False
use_feature_aware_dropout: True  # 控制是否进行feature_aware_dropout
comp_drop: True  # 控制是否进行原始dropout

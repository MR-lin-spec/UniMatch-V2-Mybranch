# arguments for dataset
dataset: cityscapes
data_root:  /home/roots/DeepLearning_Linux_MD/Dataset_MD/cityscapes
nclass: 19
crop_size: 714
use_augmix: False # 控制是否进行augmix
use_cutmix: True # 控制是否进行CutMix

# arguments for training
epochs: 100
batch_size: 2 # per GPU x 4 GPUs
lr: 0.000005
lr_multi: 40.0
criterion:
  name: OHEM
  kwargs:
    ignore_index: 255
    thresh: 0.7
    min_kept: 200000
conf_thresh: 0.95
jsd_weight: 0.1 # 建议从 0.1 开始尝试，如 0.05, 0.1, 0.2
mse_weight: 0 # ← 启用 MSE
kl_weight: 0


# arguments for model
model: dpt
backbone: dinov2_small
lock_backbone: False
use_feature_aware_dropout: True  # 控制是否进行feature_aware_dropout
feature_dropout_prob: 0.2
comp_drop: True  # 控制是否进行原始dropout

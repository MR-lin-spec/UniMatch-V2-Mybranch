#消融使用目录清单


# arguments for dataset
dataset: pascal
data_root: /home/roots/DeepLearning_Linux_MD/Dataset_MD/VOC2012     
nclass: 21
crop_size: 476 # 321  #dpt 476
use_augmix: False # 控制是否进行augmix
use_cutmix: True # 控制是否进行CutMix
cutmix_ratio: 0.5 # CutMix的比例
use_augment: True  # 控制是否进行增强

# arguments for training
epochs: 60
batch_size: 4 # 4 # per GPU 5090s dpt 6
lr: 0.000005 # 0.001   # dpt 0.000005
lr_multi:  40.0 # 10.0 # dpt 40.0
criterion:
  name: CELoss
  kwargs:
    ignore_index: 255
conf_thresh: 0.95
jsd_weight: 0.1 # 建议从 0.1 开始尝试，如 0.05, 0.1, 0.2
mse_weight: 0  # ← 启用 MSE
kl_weight: 0




# arguments for model
model: dpt
backbone: dinov2_small
lock_backbone: False
use_feature_aware_dropout: True # 控制是否进行feature_aware_dropout
feature_dropout_prob: 0.1 # feature_aware_dropout 的丢弃概率
comp_drop: True  # 控制是否进行原始dropout
